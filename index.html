<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Pila (Stack) con Flask</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="fw-bold text-primary">Simulador de Pila (LIFO)</h1>
            <p class="text-secondary">Aplicación web interactiva construida con Flask, Bootstrap y JavaScript</p>
        </header>

        <div class="row g-4">
            <!-- Panel de Control -->
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h4 class="card-title mb-3 text-dark">Panel de Control</h4>
                        
                        <!-- Configurar Capacidad -->
                        <div class="mb-3">
                            <label for="capacityInput" class="form-label fw-semibold">Capacidad de la Pila:</label>
                            <div class="input-group">
                                <input type="number" id="capacityInput" class="form-control" value="5" min="1" max="20">
                                <button class="btn btn-outline-secondary" onclick="updateCapacity()">Reiniciar Pila</button>
                            </div>
                        </div>

                        <hr>

                        <!-- Apilamiento (Push) -->
                        <div class="mb-3">
                            <label for="valorInput" class="form-label fw-semibold">Nuevo Elemento:</label>
                            <div class="input-group">
                                <input type="text" id="valorInput" class="form-control" placeholder="Escribe un valor...">
                                <button class="btn btn-primary" onclick="pushItem()">Apilarr (Push)</button>
                            </div>
                        </div>

                        <!-- Desapilar (Pop) -->
                        <div class="d-grid gap-2">
                            <button class="btn btn-danger" onclick="popItem()">Desapilar (Pop)</button>
                        </div>

                        <!-- Alertas de mensajes -->
                        <div id="alertBox" class="alert mt-3 d-none" role="alert"></div>
                    </div>
                </div>
            </div>

            <!-- Visualización de la Pila -->
            <div class="col-md-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
                        <h4 class="card-title mb-4 align-self-start text-dark">Visualización de la Pila</h4>
                        
                        <div id="stackContainer" class="w-75 d-flex flex-column align-items-center gap-2 border rounded p-3 bg-white" style="min-height: 250px; max-height: 400px; overflow-y: auto;">
                            <!-- Los elementos se cargan dinámicamente mediante JS -->
                            <span class="text-muted m-auto">La pila está vacía</span>
                        </div>

                        <div class="mt-3 text-secondary text-center">
                            <small id="stackInfo">Tope actual: Ninguno</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript para la interactividad (Fetch API) -->
    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                renderStack(data);
            } catch (error) {
                console.error("Error al obtener el estado:", error);
            }
        }

        function renderStack(data) {
            const container = document.getElementById('stackContainer');
            const info = document.getElementById('stackInfo');
            container.innerHTML = '';

            if (data.items.length === 0) {
                container.innerHTML = '<span class="text-muted m-auto">La pila está vacía</span>';
                info.innerText = 'Tope actual: Ninguno';
                return;
            }

            info.innerText = `Tope actual: ${data.peek} | Elementos: ${data.items.length}/${data.capacity}`;

            data.items.forEach((item, index) => {
                const div = document.createElement('div');
                // Si es el primer elemento visualizado, es el tope (cima de la pila)
                if (index === 0) {
                    div.className = 'w-100 p-2 text-center bg-primary text-white rounded shadow-sm fw-bold';
                    div.innerHTML = `${item} <span class="badge bg-light text-primary ms-2">Tope</span>`;
                } else {
                    div.className = 'w-100 p-2 text-center bg-secondary bg-opacity-25 text-dark rounded';
                    div.innerText = item;
                }
                container.appendChild(div);
            });
        }

        async function pushItem() {
            const valorInput = document.getElementById('valorInput');
            const valor = valorInput.value.trim();
            if (!valor) return showAlert("Ingresa un valor válido.", "warning");

            const response = await fetch('/api/push', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor })
            });
            const result = await response.json();
            
            showAlert(result.message, result.success ? "success" : "danger");
            if (result.success) {
                valorInput.value = '';
                fetchStatus();
            }
        }

        async function popItem() {
            const response = await fetch('/api/pop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const result = await response.json();
            
            showAlert(result.message, result.success ? "success" : "warning");
            fetchStatus();
        }

        async function updateCapacity() {
            const capacity = document.getElementById('capacityInput').value;
            const response = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ capacity })
            });
            const result = await response.json();
            showAlert(result.message, "success");
            fetchStatus();
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert mt-3 alert-${type}`;
            alertBox.innerText = message;
            alertBox.classList.remove('d-none');
            setTimeout(() => alertBox.classList.add('d-none'), 3000);
        }

        // Cargar estado inicial al abrir la página
        fetchStatus();
    </script>
</body>
</html>
